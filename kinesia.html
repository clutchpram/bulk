<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kinesia — AI Weight Gain Coach</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      background: #000;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      height: 100%;
      overflow: hidden;
    }

    @keyframes kpulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }
    @keyframes kup    { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadein { from{opacity:0} to{opacity:1} }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,107,43,.3); border-radius: 2px; }

    /* Layout */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }

    /* Fire canvas */
    #fire-canvas {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none;
      image-rendering: pixelated;
      background: #000;
    }

    /* Overlay */
    #overlay {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1; pointer-events: none;
      background: linear-gradient(180deg,
        rgba(0,0,0,.78) 0%,
        rgba(0,0,0,.45) 40%,
        rgba(0,0,0,.45) 65%,
        rgba(0,0,0,.85) 100%);
    }

    .glass {
      background: rgba(2,0,0,.82);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
    }
    .g-ai {
      background: rgba(5,1,0,.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,107,43,.2);
    }
    .g-user {
      background: rgba(180,70,20,.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,107,43,.35);
    }
    .g-in {
      background: rgba(4,1,0,.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Header */
    #header {
      position: sticky; top: 0; z-index: 20;
      padding: 15px 22px;
      border-bottom: 1px solid rgba(255,107,43,.12);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .logo-wrap { display: flex; align-items: center; gap: 11px; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 11px;
      background: rgba(255,107,43,.1); border: 1px solid rgba(255,107,43,.35);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-name { font-size: 17px; font-weight: 700; color: #fde8d8; letter-spacing: -0.01em; }
    .logo-sub  { font-size: 10px; color: rgba(255,180,100,.8); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; margin-top: 1px; }
    .metrics   { display: flex; gap: 7px; }
    .metric-pill {
      background: rgba(255,107,43,.08); border: 1px solid rgba(255,107,43,.25);
      border-radius: 12px; padding: 8px 14px; text-align: center; min-width: 80px;
      backdrop-filter: blur(12px);
    }
    .metric-val { font-size: 16px; font-weight: 700; color: #ff8c55; }
    .metric-lbl { font-size: 10px; color: rgba(255,150,80,.6); margin-top: 2px; letter-spacing: .08em; text-transform: uppercase; }

    /* Messages */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 22px 18px;
      display: flex; flex-direction: column; gap: 18px;
      position: relative; z-index: 10;
    }

    /* Welcome */
    #welcome {
      text-align: center; padding: 38px 16px 16px;
      animation: kup .6s ease forwards;
    }
    .welcome-icon {
      width: 68px; height: 68px; border-radius: 22px;
      background: rgba(255,107,43,.08); border: 1px solid rgba(255,107,43,.3);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px; backdrop-filter: blur(12px);
    }
    #welcome h1 {
      font-size: 26px; font-weight: 800; color: #fff;
      margin: 0 0 10px; letter-spacing: -0.02em;
      text-shadow: 0 0 32px rgba(255,107,43,.5);
    }
    #welcome p {
      font-size: 13px; color: rgba(255,220,180,.85); font-weight: 500;
      line-height: 1.75; max-width: 340px; margin: 0 auto 28px;
    }
    .quick-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 7px; max-width: 380px; margin: 0 auto;
    }
    .qbtn {
      background: rgba(255,107,43,.08); border: 1px solid rgba(255,107,43,.25);
      border-radius: 10px; padding: 11px 13px;
      color: #ffb380; font-size: 12px; font-weight: 600; line-height: 1.5;
      cursor: pointer; text-align: left; transition: all .2s;
      font-family: inherit; backdrop-filter: blur(10px);
    }
    .qbtn:hover { background: rgba(255,107,43,.14); border-color: rgba(255,107,43,.4); }
    .start-btn {
      margin-top: 18px;
      background: linear-gradient(135deg, #ff6b2b, #cc4a10);
      border: none; border-radius: 12px; padding: 13px 32px;
      color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 24px rgba(255,107,43,.4);
      transition: filter .2s;
    }
    .start-btn:hover { filter: brightness(1.1); }

    /* Message bubbles */
    .msg-row {
      display: flex; gap: 9px; align-items: flex-start;
      animation: kup .3s ease forwards;
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 28px; height: 28px; border-radius: 9px;
      background: rgba(255,107,43,.1); border: 1px solid rgba(255,107,43,.3);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px; backdrop-filter: blur(8px);
    }
    .bubble {
      max-width: 83%; padding: 11px 15px;
      font-size: 14px; font-weight: 500; line-height: 1.65;
    }
    .bubble.ai   { border-radius: 4px 16px 16px 16px; }
    .bubble.user { border-radius: 16px 4px 16px 16px; color: #fff; }
    .bubble p    { margin: 2px 0; color: #fff; font-weight: 500; line-height: 1.7; }
    .bubble h2   { font-size: 17px; font-weight: 800; color: #fff; margin: 16px 0 8px; text-shadow: 0 0 16px rgba(255,150,80,.4); }
    .bubble h3   { font-size: 15px; font-weight: 700; color: #fff; margin: 14px 0 6px; text-shadow: 0 0 12px rgba(255,150,80,.4); }
    .bubble strong { color: #ffcc99; font-weight: 700; }
    .bubble .bullet-row { display: flex; gap: 8px; margin: 4px 0; }
    .bullet-arrow { color: #ff6b2b; font-weight: 700; flex-shrink: 0; }
    .bullet-text  { color: #fff; line-height: 1.65; font-size: 14px; font-weight: 500; }
    .num-row      { display: flex; gap: 10px; margin: 4px 0; }
    .num-label    { color: #ff8c55; font-weight: 700; min-width: 18px; font-size: 13px; }
    .num-text     { color: #fff; line-height: 1.65; font-size: 14px; font-weight: 500; }

    /* Typing dots */
    .typing-dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%; background: #ff6b2b;
    }
    .dot:nth-child(1) { animation: kpulse 1.2s ease-in-out 0s infinite; }
    .dot:nth-child(2) { animation: kpulse 1.2s ease-in-out .2s infinite; }
    .dot:nth-child(3) { animation: kpulse 1.2s ease-in-out .4s infinite; }

    /* Input bar */
    #input-bar {
      position: sticky; bottom: 0; z-index: 20;
      padding: 14px 18px 18px;
      border-top: 1px solid rgba(255,107,43,.1);
      flex-shrink: 0;
    }
    .input-wrap {
      display: flex; align-items: flex-end; gap: 10px;
      border: 1px solid rgba(255,107,43,.18);
      border-radius: 15px; padding: 11px 13px;
      transition: border-color .2s;
    }
    .input-wrap:focus-within { border-color: rgba(255,107,43,.42); }
    #user-input {
      flex: 1; background: transparent; border: none;
      color: #fff; font-size: 14px; font-weight: 500;
      line-height: 1.5; font-family: inherit;
      max-height: 120px; overflow-y: auto;
      resize: none; outline: none; padding-top: 2px;
    }
    #user-input::placeholder { color: rgba(255,150,80,.45); }
    #send-btn {
      width: 33px; height: 33px; border-radius: 9px;
      background: rgba(255,107,43,.1); border: none;
      cursor: default; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
      transition: all .2s;
    }
    #send-btn.active {
      background: linear-gradient(135deg, #ff6b2b, #cc4a10);
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(255,107,43,.35);
    }
    .disclaimer {
      font-size: 10px; color: rgba(255,107,43,.25);
      text-align: center; margin: 8px 0 0; letter-spacing: .03em;
    }
  </style>
</head>
<body>

<canvas id="fire-canvas"></canvas>
<div id="overlay"></div>

<div id="app">

  <!-- Header -->
  <div id="header" class="glass">
    <div class="logo-wrap">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
          <path d="M4 14 Q7 8 10 14 Q13 20 16 14 Q19 8 22 14 Q25 20 28 14" stroke="#ff6b2b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="logo-name">Kinesia</div>
        <div class="logo-sub">AI Weight Gain Coach</div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric-pill">
        <div class="metric-val" id="metric-current">—</div>
        <div class="metric-lbl">Current</div>
      </div>
      <div class="metric-pill">
        <div class="metric-val" id="metric-target">—</div>
        <div class="metric-lbl">Target</div>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div id="welcome">
      <div class="welcome-icon">
        <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
          <path d="M4 14 Q7 8 10 14 Q13 20 16 14 Q19 8 22 14 Q25 20 28 14" stroke="#ff6b2b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Your journey starts here</h1>
      <p>Kinesia builds a precise, science-backed weight gain plan tailored to your body, goals, and lifestyle.</p>
      <div class="quick-grid">
        <button class="qbtn" onclick="quickSend('Design my meal plan for a lean bulk')">Design my meal plan for a lean bulk</button>
        <button class="qbtn" onclick="quickSend('Create my hypertrophy training split')">Create my hypertrophy training split</button>
        <button class="qbtn" onclick="quickSend('I\'m not gaining weight — help me')">I'm not gaining weight — help me</button>
        <button class="qbtn" onclick="quickSend('What supplements should I take?')">What supplements should I take?</button>
      </div>
      <button class="start-btn" onclick="quickSend('Hi Kinesia, I am ready to start my weight gain journey!')">Begin My Journey →</button>
    </div>
  </div>

  <!-- Input -->
  <div id="input-bar" class="glass">
    <div class="input-wrap g-in">
      <textarea id="user-input" rows="1" placeholder="Ask Kinesia anything about your journey…"></textarea>
      <button id="send-btn" onclick="handleSend()">
        <svg id="send-icon" width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12l7-7 7 7" stroke="rgba(255,107,43,.3)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <p class="disclaimer">Kinesia provides guidance only — consult a healthcare professional for medical advice</p>
  </div>

</div>

<script>
const SYSTEM_PROMPT = `You are Kinesia, an elite AI fitness, nutrition, and wellness coach. Your personality is warm, motivating, precise, and science-backed.

You help users:

* Lose weight safely and sustainably
* Gain weight and build muscle
* Improve body composition
* Create personalized meal plans and nutrition strategies
* Design workout programs for strength, muscle gain, fat loss, and general fitness
* Track progress and provide adaptive feedback
* Improve recovery, sleep, hydration, and overall health habits
* Stay motivated and accountable

Your tone: confident but empathetic. Use concise bullet points for plans, bold key numbers when relevant. Always personalize advice based on the user's goals, body stats, activity level, dietary preferences, and lifestyle.

When a user first messages, warmly greet them as Kinesia and ask for relevant information such as age, height, weight, activity level, fitness goal, dietary preferences, and any limitations if needed.

Format responses clearly with sections when giving detailed plans. Use emoji sparingly only for warmth, not decoration.`;


// ── Fire Canvas ──────────────────────────────────────────────
(function initFire() {
  const canvas = document.getElementById('fire-canvas');
  const ctx = canvas.getContext('2d');
  const SCALE = 4;
  let W, H, fire, img;

  const palette = Array.from({length:256},(_,i)=>{
    if(i<40)  return [0,0,0,0];
    if(i<90)  { const t=(i-40)/50; return [Math.floor(t*180),0,0,Math.floor(t*220)]; }
    if(i<150) { const t=(i-90)/60; return [180+Math.floor(t*75),Math.floor(t*80),0,230+Math.floor(t*25)]; }
    if(i<210) { const t=(i-150)/60; return [255,80+Math.floor(t*150),Math.floor(t*40),255]; }
    const t=(i-210)/45; return [255,230+Math.floor(t*25),40+Math.floor(t*180),255];
  });

  function setup() {
    W = Math.floor(window.innerWidth/SCALE);
    H = Math.floor(window.innerHeight/SCALE);
    canvas.width=W; canvas.height=H;
    canvas.style.width='100vw'; canvas.style.height='100vh';
    fire = new Uint8Array(W*H);
    img  = ctx.createImageData(W,H);
    seedBottom();
  }

  function seedBottom() {
    for(let x=0;x<W;x++) fire[(H-1)*W+x]=200+Math.floor(Math.random()*55);
  }

  let frame=0;
  function step() {
    frame++;
    if(frame%2===0) seedBottom();
    for(let y=1;y<H;y++){
      for(let x=0;x<W;x++){
        const src=y*W+x;
        const decay=Math.random()<.45?1:0;
        const wind=Math.floor(Math.random()*3)-1;
        const nx=(x+wind+W)%W;
        fire[(y-1)*W+nx]=Math.max(0,fire[src]-decay);
      }
    }
    for(let i=0;i<W*H;i++){
      const [r,g,b,a]=palette[fire[i]]; const p=i*4;
      img.data[p]=r;img.data[p+1]=g;img.data[p+2]=b;img.data[p+3]=a;
    }
    ctx.putImageData(img,0,0);
    requestAnimationFrame(step);
  }

  setup();
  step();
  window.addEventListener('resize', setup);
})();

// ── Chat State ───────────────────────────────────────────────
let messages = [];
let loading  = false;

const messagesEl = document.getElementById('messages');
const welcomeEl  = document.getElementById('welcome');
const inputEl    = document.getElementById('user-input');
const sendBtn    = document.getElementById('send-btn');
const sendIcon   = document.getElementById('send-icon');

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  updateSendBtn();
});

inputEl.addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }
});

function updateSendBtn() {
  const active = inputEl.value.trim() && !loading;
  sendBtn.className = active ? 'active' : '';
  sendIcon.querySelector('path').setAttribute('stroke', active ? '#fff' : 'rgba(255,107,43,.3)');
}

function extractMetrics(text) {
  const cw = text.match(/(\d+\.?\d*)\s*(kg|lbs?)/i);
  const tw = text.match(/target[^.]*?(\d+\.?\d*)\s*(kg|lbs?)/i);
  if(cw && !tw) document.getElementById('metric-current').textContent = cw[1]+cw[2];
  if(tw)        document.getElementById('metric-target').textContent  = tw[1]+tw[2];
}

function formatText(text) {
  text = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>');

  return text.split('\n').map(line => {
    if(line.startsWith('## '))  return `<h2>${line.slice(3)}</h2>`;
    if(line.startsWith('### ')) return `<h3>${line.slice(4)}</h3>`;
    if(line.startsWith('- ')||line.startsWith('• '))
      return `<div class="bullet-row"><span class="bullet-arrow">›</span><span class="bullet-text">${line.slice(2)}</span></div>`;
    const nm = line.match(/^(\d+)\.\s+(.*)/);
    if(nm) return `<div class="num-row"><span class="num-label">${nm[1]}.</span><span class="num-text">${nm[2]}</span></div>`;
    if(!line.trim()) return '<div style="height:8px"></div>';
    return `<p>${line}</p>`;
  }).join('');
}

function appendMessage(role, content) {
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  if(role === 'assistant') {
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.innerHTML = `<svg width="13" height="13" viewBox="0 0 28 28" fill="none"><path d="M4 14 Q7 8 10 14 Q13 20 16 14 Q19 8 22 14 Q25 20 28 14" stroke="#ff6b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role} ${role==='ai'?'g-ai':'g-user'}`;
  if(role === 'user') {
    bubble.classList.add('g-user');
    bubble.textContent = content;
  } else {
    bubble.classList.add('g-ai');
    bubble.innerHTML = formatText(content);
  }
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row assistant'; row.id = 'typing-row';
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.innerHTML = `<svg width="13" height="13" viewBox="0 0 28 28" fill="none"><path d="M4 14 Q7 8 10 14 Q13 20 16 14 Q19 8 22 14 Q25 20 28 14" stroke="#ff6b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble ai g-ai';
  bubble.innerHTML = `<div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  row.appendChild(av); row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-row');
  if(el) el.remove();
}

async function sendMessage(userText) {
  if(!userText.trim() || loading) return;
  welcomeEl.style.display = 'none';
  messages.push({ role:'user', content:userText });
  appendMessage('user', userText);
  extractMetrics(userText);
  loading = true; updateSendBtn();
  showTyping();
  try {
    const res = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:1000,
        system: SYSTEM_PROMPT,
        messages: messages.map(m=>({role:m.role,content:m.content}))
      })
    });
    const data = await res.json();
    const reply = data.content || data.error || 'Try again.';
    messages.push({role:'assistant',content:reply});
    hideTyping();
    appendMessage('assistant', reply);
  } catch {
    hideTyping();
    appendMessage('assistant', 'Connection issue. Please try again.');
  }
  loading = false; updateSendBtn();
}

function handleSend() {
  const text = inputEl.value.trim();
  if(!text || loading) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  updateSendBtn();
  sendMessage(text);
}

function quickSend(text) {
  sendMessage(text);
}
</script>
</body>
</html>
